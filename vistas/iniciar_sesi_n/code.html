last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><button aria-label="Volver" class="w-11 h-11 -ml-space-xs flex items-center justify-center rounded-full text-on-surface hover:text-text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span></button><div class="flex items-center gap-space-sm"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDM-d-K412ujgokIl8bCakM3Dq7uJizlcaO-oG-kiRgsTIcU8_UBI-pp6TinG-CdyVnFKmKQ3l_vZ7llg7TAOUm4NpXT-z0F7yiNjq_e9vdqBBPFavJ9Jtiyi6lMNi8Ljfh2sAkU0jlbrF8_MImzCSlgCYahqUHqkL_lQj_jWsvQ1Fwr609yxzeWiGrGXE3Gl_EKZFdf6XvUa5qkCRwxpd71_pxw99_MyMcizAzWOqPx_iUAmIPstVQ" alt="AI Ticket It Logo" class="w-8 h-8 rounded-lg object-contain shadow-[0_0_12px_rgba(255,0,127,0.35)]"><span class="font-headline-sm text-headline-sm text-text-primary tracking-tight">AI Ticket It</span></div><div class="w-11 h-11"></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface-container-lowest"><div class="flex flex-col w-full pb-8">
<!-- Glowing Background Orbs (Decorative) -->
<div class="relative w-full overflow-hidden pointer-events-none -mb-32">
<div class="absolute -top-10 -left-12 w-48 h-48 rounded-full bg-accent-electric/15 blur-3xl"></div>
<div class="absolute top-8 -right-10 w-44 h-44 rounded-full bg-tertiary/15 blur-3xl"></div>
</div>
<!-- Header Section -->
<section class="relative z-10 pt-2 pb-5 flex flex-col items-start gap-1">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high/80 backdrop-blur-md mb-2">
<span class="w-2 h-2 rounded-full bg-status-success animate-pulse"></span>
<span class="font-label-sm text-label-sm text-tertiary">ACCESO SEGURO EN VIVO</span>
</div>
<h1 class="font-display-sm text-display-sm text-text-primary tracking-tight">
      ¡Hola de nuevo!
    </h1>
<p class="font-body-md text-body-md text-text-muted">
      Ingresá a tu cuenta para gestionar tus entradas o tus eventos en tiempo real.
    </p>
</section>
<!-- Role Quick Switcher / Demo Presets -->

<!-- Form Card -->
<div class="relative z-10 bg-surface-card rounded-2xl p-5 shadow-xl flex flex-col gap-4">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-text-secondary" for="email-input">
        Correo electrónico
      </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-text-muted pointer-events-none transition-colors" id="email-icon">
          mail
        </span>
<input class="w-full h-12 pl-11 pr-4 rounded-xl bg-surface-container-high text-text-primary placeholder:text-text-muted font-body-md text-body-md focus:outline-none transition-all shadow-inner" id="email-input" onblur="focusGlow('email', false)" onfocus="focusGlow('email', true)" placeholder="ejemplo@correo.com" type="email" value="comprador@utn.edu.ar">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-text-secondary" for="password-input">
        Contraseña
      </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-text-muted pointer-events-none transition-colors" id="password-icon">
          lock
        </span>
<input class="w-full h-12 pl-11 pr-12 rounded-xl bg-surface-container-high text-text-primary placeholder:text-text-muted font-body-md text-body-md focus:outline-none transition-all shadow-inner" id="password-input" onblur="focusGlow('pass', false)" onfocus="focusGlow('pass', true)" placeholder="••••••••" type="password" value="demoPass2025">
<button aria-label="Revelar contraseña" class="absolute right-3 w-8 h-8 rounded-lg flex items-center justify-center text-text-muted hover:text-text-primary transition-colors active:scale-90" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Options Row: Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="sr-only peer" id="remember-me" type="checkbox">
<div class="w-5 h-5 rounded-md bg-surface-container-high peer-checked:bg-accent-electric flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[16px] text-text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
            check
          </span>
</div>
<span class="font-body-sm text-body-sm text-text-secondary">Recordarme</span>
</label>
<a class="font-label-md text-label-md text-tertiary hover:underline transition-all" href="#">
        ¿Olvidaste tu contraseña?
      </a>
</div>
<!-- Main CTA Button -->
<div class="pt-2">
<button class="w-full h-[52px] rounded-full bg-gradient-to-r from-accent-electric via-primary-container to-accent-electric bg-[length:200%_auto] text-text-primary font-label-lg text-label-lg tracking-wider uppercase flex items-center justify-center gap-2 shadow-[0_6px_24px_rgba(255,0,127,0.45)] hover:shadow-[0_8px_30px_rgba(255,0,127,0.6)] active:scale-[0.98] transition-all duration-300" id="submit-btn" onclick="simulateLogin()" type="button">
<span id="btn-text" class="">INGRESAR A MI CUENTA</span>
<span class="material-symbols-outlined text-[20px]" id="btn-icon">arrow_forward</span>
</button>
</div>
</div>
<!-- Social / Institutional Logins Section -->

<!-- Sign up Link -->
<div class="relative z-10 mt-6 text-center">
<p class="font-body-md text-body-md text-text-muted">
      ¿Todavía no tenés cuenta? 
      <a class="font-label-lg text-label-lg text-tertiary hover:text-badge-cyan-glow hover:underline transition-colors ml-1 inline-flex items-center gap-0.5" href="#">
        Registrate gratis
        <span class="material-symbols-outlined text-[16px]">north_east</span>
</a>
</p>
</div>
<!-- Security Banner Footer -->

</div>
<script>
  function togglePassword() {
    const input = document.getElementById('password-input');
    const icon = document.getElementById('eye-icon');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function setDemoCredentials(role) {
    const email = document.getElementById('email-input');
    const pass = document.getElementById('password-input');
    const buyerBtn = document.getElementById('btn-role-buyer');
    const orgBtn = document.getElementById('btn-role-org');

    if (role === 'buyer') {
      if (email) email.value = 'comprador@utn.edu.ar';
      if (pass) pass.value = 'comprador2025';
      buyerBtn?.classList.remove('bg-surface-container-low');
      buyerBtn?.classList.add('bg-surface-container-high', 'shadow-sm');
      orgBtn?.classList.remove('bg-surface-container-high', 'shadow-sm');
      orgBtn?.classList.add('bg-surface-container-low');
    } else {
      if (email) email.value = 'sonora@producciones.com';
      if (pass) pass.value = 'productoraVIP!';
      orgBtn?.classList.remove('bg-surface-container-low');
      orgBtn?.classList.add('bg-surface-container-high', 'shadow-sm');
      buyerBtn?.classList.remove('bg-surface-container-high', 'shadow-sm');
      buyerBtn?.classList.add('bg-surface-container-low');
    }
  }

  function focusGlow(field, isFocused) {
    const icon = document.getElementById(field === 'email' ? 'email-icon' : 'password-icon');
    if (icon) {
      if (isFocused) {
        icon.classList.remove('text-text-muted');
        icon.classList.add('text-accent-electric');
      } else {
        icon.classList.remove('text-accent-electric');
        icon.classList.add('text-text-muted');
      }
    }
  }

  function simulateLogin() {
    const btn = document.getElementById('submit-btn');
    const text = document.getElementById('btn-text');
    const icon = document.getElementById('btn-icon');
    if (!btn || !text || !icon) return;

    btn.disabled = true;
    text.textContent = 'VERIFICANDO...';
    icon.textContent = 'sync';
    icon.classList.add('animate-spin');

    setTimeout(() => {
      text.textContent = '¡SESIÓN INICIADA!';
      icon.classList.remove('animate-spin');
      icon.textContent = 'check_circle';
      btn.classList.remove('from-accent-electric', 'via-primary-container', 'to-accent-electric');
      btn.classList.add('bg-status-success');

      setTimeout(() => {
        text.textContent = 'INGRESAR A MI CUENTA';
        icon.textContent = 'arrow_forward';
        btn.classList.remove('bg-status-success');
        btn.classList.add('from-accent-electric', 'via-primary-container', 'to-accent-electric');
        btn.disabled = false;
      }, 1500);
    }, 1200);
  }
</script></main>

</body></html>
